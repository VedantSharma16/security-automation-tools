[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishtriage"
version = "0.1.0"
description = "Offline phishing email (.eml) analyzer: header forensics, URL and attachment analysis, risk scoring, IOC export."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
phishtriage = "phishtriage.cli:main"

[tool.setuptools.packages.find]
include = ["phishtriage*"]
