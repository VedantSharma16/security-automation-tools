name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.project }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - recon-agent
          - log-triage-assistant
          - ioc-triage-assistant
          - process_threat_hunter
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (pyproject-based project)
        if: hashFiles(format('{0}/pyproject.toml', matrix.project)) != ''
        working-directory: ${{ matrix.project }}
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Install dependencies (requirements-based project)
        if: hashFiles(format('{0}/pyproject.toml', matrix.project)) == ''
        working-directory: ${{ matrix.project }}
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: python -m pytest -v

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .
