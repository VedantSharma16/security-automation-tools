[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragshield"
version = "0.1.0"
description = "Detect and neutralise indirect prompt injection in documents before they enter an LLM context."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ragshield = "ragshield.cli:main"

[tool.setuptools.packages.find]
include = ["ragshield*"]
