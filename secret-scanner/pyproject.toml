[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretscan"
version = "0.1.0"
description = "Git-aware scanner for hardcoded secrets and credential leaks, with an optional LLM executive summary."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
llm = ["anthropic>=0.30.0"]
dev = ["pytest>=7.0"]

[project.scripts]
secretscan = "secretscan.cli:main"

[tool.setuptools.packages.find]
include = ["secretscan*"]
