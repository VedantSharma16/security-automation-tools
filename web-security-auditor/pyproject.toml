[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-auditor"
version = "0.1.0"
description = "Passive HTTP security header, TLS, and exposure auditor for authorized web app assessments."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
webauditor = "webauditor.cli:main"

[tool.setuptools.packages.find]
include = ["webauditor*"]
