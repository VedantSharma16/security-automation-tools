[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-auditor"
version = "0.1.0"
description = "Passively audit HTTP security headers, cookie hardening, and TLS certificate posture for authorized web targets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
webauditor = "webauditor.cli:main"

[tool.setuptools.packages.find]
include = ["webauditor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
