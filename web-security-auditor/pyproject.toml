[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-security-auditor"
version = "0.1.0"
description = "Recon a web target for security header, cookie, CORS, TLS, and information-disclosure misconfigurations, mapped to OWASP Top 10 categories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
web-security-audit = "webauditor.cli:main"

[tool.setuptools.packages.find]
include = ["webauditor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
