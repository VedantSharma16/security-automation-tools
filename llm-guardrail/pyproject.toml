[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-guardrail"
version = "0.1.0"
description = "Trust-boundary-aware prompt-injection firewall for LLM, RAG and agent pipelines, with an evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
llm-guardrail = "llm_guardrail.cli:main"

[tool.setuptools.packages.find]
include = ["llm_guardrail*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
