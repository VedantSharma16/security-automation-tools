[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-recon-scanner"
version = "0.1.0"
description = "HTTP security header, TLS, technology fingerprinting, robots.txt/sitemap, and subdomain recon scanner."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
web-recon-scanner = "webrecon.cli:main"

[tool.setuptools.packages.find]
include = ["webrecon*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
