title: PowerShell Execution With Encoded Command
id: 73c7c4e3-25c5-4ed9-8da1-64bfb7da6247
status: test
description: |
  Detects PowerShell launched with an encoded command argument (-enc, -EncodedCommand
  and abbreviations, with dash or slash). Attackers base64-encode payloads to evade
  command-line inspection and simple keyword matching.
author: Vedant Sharma
date: 2026-11-20
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_flag:
    CommandLine|windash|contains:
      - ' -e '
      - ' -en '
      - ' -enc '
      - ' -enco'
      - ' -ec '
  filter_sccm:
    ParentImage|endswith: '\CCM\CcmExec.exe'
  condition: all of selection_* and not filter_sccm
falsepositives:
  - Management agents (SCCM, some RMM tools) that ship encoded scripts
level: high
