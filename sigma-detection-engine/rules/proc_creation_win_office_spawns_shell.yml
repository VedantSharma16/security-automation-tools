title: Office Application Spawning Script Interpreter
id: 6f1b64ac-32a5-4040-bf88-cbcf495a7315
status: stable
description: |
  Detects Microsoft Office applications spawning command or script interpreters,
  the classic signal of a weaponised macro document opened by a user.
author: Vedant Sharma
date: 2026-11-20
tags:
  - attack.initial_access
  - attack.t1566.001
  - attack.execution
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\regsvr32.exe'
      - '\rundll32.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate macro-enabled business workbooks (allow-list by document path)
level: high
