title: Office Application Spawning a Shell or Script Host
id: 7c1b3e95-0f26-4a7d-8e4c-9b2d5f1a3e06
status: stable
description: |
  A Microsoft Office process launching cmd, PowerShell or a script host is
  the classic signature of a malicious macro document (phishing attachment).
author: Vedant Sharma
tags:
  - attack.initial_access
  - attack.t1566.001
  - attack.execution
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legacy business macros that shell out (should be inventoried and allow-listed)
level: high
tests:
  match:
    - ParentImage: 'C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE'
      Image: 'C:\Windows\System32\cmd.exe'
      CommandLine: 'cmd.exe /c powershell -w hidden -c iex(...)'
  no_match:
    - ParentImage: 'C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE'
      Image: 'C:\Windows\splwow64.exe'
    - ParentImage: 'C:\Windows\explorer.exe'
      Image: 'C:\Windows\System32\cmd.exe'
