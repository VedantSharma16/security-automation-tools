title: LSASS Memory Dump via Comsvcs MiniDump or ProcDump
id: 0d3e7c52-91a4-4b8f-a3c6-5e2b7f9d1c02
status: stable
description: |
  Dumping LSASS process memory with the built-in comsvcs.dll MiniDump export
  (rundll32) or Sysinternals ProcDump. The dump yields NTLM hashes and
  Kerberos tickets for offline cracking / pass-the-hash.
author: Vedant Sharma
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_comsvcs:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
      - 'comsvcs'
      - 'minidump'
  selection_procdump:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
    CommandLine|contains: 'lsass'
  condition: 1 of selection_*
falsepositives:
  - Authorised incident-response memory acquisition
level: critical
tests:
  match:
    - Image: 'C:\Windows\System32\rundll32.exe'
      CommandLine: 'rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump 624 C:\temp\l.dmp full'
    - Image: 'C:\Tools\procdump64.exe'
      CommandLine: 'procdump64.exe -accepteula -ma lsass.exe out.dmp'
  no_match:
    - Image: 'C:\Windows\System32\rundll32.exe'
      CommandLine: 'rundll32.exe shell32.dll,Control_RunDLL'
    - Image: 'C:\Tools\procdump64.exe'
      CommandLine: 'procdump64.exe -ma chrome.exe'
