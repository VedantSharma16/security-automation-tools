title: Volume Shadow Copy Deletion
id: 9e2c4a17-3b58-4d6e-b0f1-7c8d2a4e6f04
status: stable
description: |
  Deleting Volume Shadow Copies or the backup catalog prevents recovery and
  is a near-universal precursor to ransomware encryption.
author: Vedant Sharma
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'catalog'
  condition: 1 of selection_*
falsepositives:
  - Rare; backup software rotating its own snapshots (tune by parent image)
level: critical
tests:
  match:
    - Image: 'C:\Windows\System32\vssadmin.exe'
      CommandLine: 'vssadmin.exe Delete Shadows /All /Quiet'
    - Image: 'C:\Windows\System32\wbem\WMIC.exe'
      CommandLine: 'wmic shadowcopy delete'
  no_match:
    - Image: 'C:\Windows\System32\vssadmin.exe'
      CommandLine: 'vssadmin list shadows'
