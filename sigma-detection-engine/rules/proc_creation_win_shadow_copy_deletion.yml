title: Volume Shadow Copy Deletion
id: 5eda892b-dc5b-4cb1-9629-e99b7df1a0a4
status: stable
description: |
  Detects deletion of Volume Shadow Copies or backup catalogs via vssadmin, wmic or
  wbadmin. Ransomware operators do this immediately before encryption to inhibit recovery.
author: Vedant Sharma
date: 2026-11-20
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'catalog'
  condition: 1 of selection_*
falsepositives:
  - Backup software rotating snapshots (verify parent process)
level: critical
