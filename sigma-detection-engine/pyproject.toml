[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmalite"
version = "0.1.0"
description = "A from-scratch Sigma rule engine: evaluate detection rules against JSON event logs, unit-test detections, map ATT&CK coverage, and correlate alerts into incidents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sigmalite = "sigmalite.cli:main"

[tool.setuptools.packages.find]
include = ["sigmalite*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
