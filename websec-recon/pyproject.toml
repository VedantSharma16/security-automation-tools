[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websec-recon"
version = "0.1.0"
description = "Authorized external recon: subdomain enumeration, port scanning, HTTP header, and TLS certificate checks merged into one scored report."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
websec-recon = "recon.cli:main"

[tool.setuptools.packages.find]
include = ["recon*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
