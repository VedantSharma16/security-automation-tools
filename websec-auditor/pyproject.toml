[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websec-auditor"
version = "0.1.0"
description = "Passive web security posture auditor: HTTP security headers, cookie flags, TLS/certificate config, and lightweight tech fingerprinting, graded like a pentest recon checklist."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
websec-auditor = "websec_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["websec_auditor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
