[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam-harness"
version = "0.1.0"
description = "Red-team harness for LLM/RAG apps: prompt injection, system-prompt leakage and data-exfiltration testing with canary tokens, plus a measurable injection guard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
llm-redteam = "llm_redteam.cli:main"

[tool.setuptools.packages.find]
include = ["llm_redteam*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
