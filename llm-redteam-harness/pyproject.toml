[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptprobe"
version = "0.1.0"
description = "Prompt-injection red-team harness and heuristic input guard for LLM applications."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
llm = ["anthropic>=0.30.0"]
dev = ["pytest>=7.0"]

[project.scripts]
promptprobe = "promptprobe.cli:main"

[tool.setuptools.packages.find]
include = ["promptprobe*"]
