[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmredteam"
version = "0.1.0"
description = "Automated prompt-injection / jailbreak / exfiltration test harness for LLM applications, mapped to OWASP LLM Top 10."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
llm = ["anthropic>=0.30.0"]
dev = ["pytest>=7.0"]

[project.scripts]
llmredteam = "llmredteam.cli:main"

[tool.setuptools.packages.find]
include = ["llmredteam*"]
