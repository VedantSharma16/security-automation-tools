[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-recon-auditor"
version = "0.1.0"
description = "Passive HTTP attack-surface recon: security headers, sensitive path exposure, and TLS posture, with an optional LLM executive summary."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
webrecon = "webrecon.cli:main"

[tool.setuptools.packages.find]
include = ["webrecon*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
