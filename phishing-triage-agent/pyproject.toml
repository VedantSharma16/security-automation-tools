[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-triage-agent"
version = "0.1.0"
description = "Tool-calling agentic pipeline that investigates a raw .eml message and produces a phishing triage verdict with an evidence trace."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
phishing-agent = "phishing_agent.cli:main"

[tool.setuptools.packages.find]
include = ["phishing_agent*"]

[tool.setuptools.package-data]
phishing_agent = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
