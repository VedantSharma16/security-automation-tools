[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-agent"
version = "0.1.0"
description = "Autonomous, tool-calling SOC analyst agent that investigates security incidents via a multi-step LLM tool-use loop, with a fully offline deterministic fallback planner."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
soc-agent = "soc_agent.cli:main"

[tool.setuptools.packages.find]
include = ["soc_agent*"]

[tool.setuptools.package-data]
soc_agent = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
