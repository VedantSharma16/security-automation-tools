title: Linux Reverse Shell One-Liner
id: 9561d4f0-e499-4a25-a954-65bb05de06c1
status: test
description: Detects common interactive reverse-shell one-liners (bash /dev/tcp, netcat -e, python/perl socket spawning a shell).
author: Vedant Sharma
logsource:
  category: process_creation
  product: linux
detection:
  selection_bash_devtcp:
    CommandLine|contains: '/dev/tcp/'
    CommandLine|re: '(?i)(bash|sh)\s+-i'
  selection_netcat:
    Image|endswith:
      - '/nc'
      - '/ncat'
      - '/netcat'
    CommandLine|re: '\s-(e|c)\s+/bin/(ba)?sh'
  selection_scripted:
    CommandLine|contains|all:
      - 'socket'
      - 'connect'
      - '/bin/'
    CommandLine|re: '(?i)(python3?|perl|ruby)\s+-(c|e)'
  condition: 1 of selection_*
falsepositives:
  - Red-team exercises and CTF environments.
level: critical
tags:
  - attack.execution
  - attack.t1059.004
