title: LSASS Memory Dump via Comsvcs MiniDump
id: d1d8456d-334a-4a0c-8fc8-2fa48e50ea88
status: test
description: |
  Detects rundll32 invoking the MiniDump export of comsvcs.dll, a built-in technique for
  dumping LSASS memory to harvest credentials without dropping tools such as Mimikatz.
author: Vedant Sharma
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\rundll32.exe'
    - OriginalFileName: 'RUNDLL32.EXE'
  selection_cli_export:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'minidump'
  selection_cli_ordinal:
    CommandLine|contains|all:
      - 'comsvcs'
      - '#24'
  condition: selection_img and 1 of selection_cli_*
falsepositives:
  - None expected.
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.defense_evasion
  - attack.t1218.011
