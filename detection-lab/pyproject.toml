[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-lab"
version = "0.1.0"
description = "Sigma-compatible detection-as-code engine: scan events, lint and unit-test rules, measure ATT&CK coverage, and draft new rules with a test-driven LLM loop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
detlab = "detlab.cli:main"

[tool.setuptools.packages.find]
include = ["detlab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
