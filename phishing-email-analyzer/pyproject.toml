[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishscan"
version = "0.1.0"
description = "Offline phishing email analyzer: header authentication, URL/lookalike heuristics, attachment risk, and an explainable verdict."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
phishscan = "phishscan.cli:main"

[tool.setuptools.packages.find]
include = ["phishscan*"]
