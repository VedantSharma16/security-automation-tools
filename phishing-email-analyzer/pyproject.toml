[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishscope"
version = "0.1.0"
description = "Static phishing-email (.eml) analyzer: header authentication, lookalike domains, link and attachment analysis, hidden-text / LLM prompt-injection detection, and IOC export."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
llm = ["anthropic>=0.30.0"]
dev = ["pytest>=7.0"]

[project.scripts]
phishscope = "phishscope.cli:main"

[tool.setuptools.packages.find]
include = ["phishscope*"]
