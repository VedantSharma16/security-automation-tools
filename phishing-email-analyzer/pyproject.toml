[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishtriage"
version = "0.1.0"
description = "Triage suspicious .eml messages: header authentication, lookalike domains, URL and attachment analysis, scored verdicts, IOC export, and an optional grounded LLM narrative."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]
dev = ["pytest>=7.0"]

[project.scripts]
phishtriage = "phishtriage.cli:main"

[tool.setuptools.packages.find]
include = ["phishtriage*"]

[tool.setuptools.package-data]
phishtriage = ["data/*.json"]
