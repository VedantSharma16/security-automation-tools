[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesec"
version = "0.1.0"
description = "Static security scanner for hardcoded secrets and insecure Python coding patterns, with an optional LLM remediation narrative."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
llm = ["anthropic>=0.30.0"]
dev = ["pytest>=7.0"]

[project.scripts]
codesec = "codesec.cli:main"

[tool.setuptools.packages.find]
include = ["codesec*"]
