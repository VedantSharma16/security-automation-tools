[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-lite"
version = "0.1.0"
description = "Detection-as-code: a lightweight Sigma-compatible rule engine with ATT&CK coverage reporting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sigma-lite = "sigmalite.cli:main"

[tool.setuptools.packages.find]
include = ["sigmalite*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
