[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmalite"
version = "0.1.0"
description = "Sigma-style detection rule engine for JSONL event logs with MITRE ATT&CK reporting."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sigmalite = "sigmalite.cli:main"

[tool.setuptools.packages.find]
include = ["sigmalite*"]
