title: Credential Dumping via LSASS Access
id: sl-0002
description: Process opens LSASS or uses comsvcs MiniDump / procdump against it.
level: critical
tags: [attack.credential_access, attack.t1003.001]
logsource:
  category: process_creation
detection:
  minidump:
    CommandLine|contains|all: ['comsvcs', 'minidump']
  procdump:
    Image|endswith: '\procdump.exe'
    CommandLine|contains: 'lsass'
  condition: minidump or procdump
