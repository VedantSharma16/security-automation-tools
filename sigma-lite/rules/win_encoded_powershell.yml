id: win-ps-encoded
title: Encoded PowerShell Command
description: PowerShell launched with an encoded or hidden command, common in malware loaders.
level: high
tags: [attack.execution, attack.t1059.001, attack.defense_evasion, attack.t1027]
logsource: {category: process_creation, product: windows}
detection:
  img:
    Image|endswith: ['\powershell.exe', '\pwsh.exe']
  flags:
    CommandLine|contains: [' -enc ', ' -encodedcommand ', ' -e JAB']
  hidden:
    CommandLine|contains|all: ['-w', 'hidden']
  condition: img and (flags or hidden)
