title: Office Application Spawning Shell
id: sl-0002
description: Word/Excel spawning a command interpreter suggests a malicious macro.
level: critical
tags: [attack.execution, attack.t1204.002, attack.t1059.003]
detection:
  parent:
    ParentImage|endswith: ['\winword.exe', '\excel.exe', '\outlook.exe']
  child:
    Image|endswith: ['\cmd.exe', '\powershell.exe', '\wscript.exe']
  condition: parent and child
tests:
  match:
    - {ParentImage: 'C:\Office\WINWORD.EXE', Image: 'C:\Windows\System32\cmd.exe'}
  no_match:
    - {ParentImage: 'C:\Windows\explorer.exe', Image: 'C:\Windows\System32\cmd.exe'}
