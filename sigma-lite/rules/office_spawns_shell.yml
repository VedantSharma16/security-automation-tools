title: Office Application Spawns Shell
id: 7a1c0002-0000-4000-8000-000000000002
description: Word/Excel/Outlook spawning a command interpreter suggests a malicious macro.
level: critical
tags: [attack.initial_access, attack.execution, attack.t1566.001, attack.t1204.002]
detection:
  parent:
    ParentImage|endswith: ['\winword.exe', '\excel.exe', '\outlook.exe', '\powerpnt.exe']
  child:
    Image|endswith: ['\cmd.exe', '\powershell.exe', '\wscript.exe', '\mshta.exe']
  condition: parent and child
