title: LSASS Credential Dumping Tools
id: sl-0004
description: Known tooling or ProcDump/comsvcs patterns used to dump LSASS memory.
level: critical
tags: [attack.credential_access, attack.t1003.001]
detection:
  procdump:
    CommandLine|contains|all: ['procdump', 'lsass']
  comsvcs:
    CommandLine|contains|all: ['comsvcs', 'minidump']
  mimikatz:
    CommandLine|contains: ['sekurlsa::', 'mimikatz']
  condition: 1 of them
tests:
  match:
    - {CommandLine: 'procdump.exe -ma lsass.exe out.dmp'}
    - {CommandLine: 'rundll32 C:\windows\system32\comsvcs.dll, MiniDump 624 x.dmp full'}
  no_match:
    - {CommandLine: 'procdump.exe -ma notepad.exe out.dmp'}
