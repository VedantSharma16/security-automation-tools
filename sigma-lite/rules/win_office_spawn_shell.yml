id: win-office-shell
title: Office Application Spawning Shell
level: high
tags: [attack.initial_access, attack.t1566.001, attack.execution, attack.t1204.002]
logsource: {category: process_creation, product: windows}
detection:
  parent:
    ParentImage|endswith: ['\winword.exe', '\excel.exe', '\outlook.exe']
  child:
    Image|endswith: ['\cmd.exe', '\powershell.exe', '\wscript.exe', '\mshta.exe']
  condition: parent and child
