title: PowerShell Encoded Command
id: sl-0001
description: PowerShell launched with an encoded command, commonly used to hide payloads.
logsource: {category: process_creation, product: windows}
detection:
  img:
    Image|endswith: ['\powershell.exe', '\pwsh.exe']
  flag:
    CommandLine|contains: [' -enc ', ' -encodedcommand ', ' -e ']
  condition: img and flag
falsepositives: [Some legitimate management tooling]
level: high
tags: [attack.execution, attack.t1059.001, attack.defense_evasion, attack.t1027]
