title: PowerShell Encoded Command Execution
id: sl-0001
description: PowerShell launched with an encoded or hidden-window payload, common in malware loaders.
level: high
tags: [attack.execution, attack.t1059.001, attack.defense_evasion, attack.t1027]
logsource:
  category: process_creation
detection:
  img:
    Image|endswith: ['\powershell.exe', '\pwsh.exe']
  flags:
    CommandLine|contains: [' -enc ', ' -encodedcommand ', ' -w hidden', ' -windowstyle hidden']
  condition: img and flags
