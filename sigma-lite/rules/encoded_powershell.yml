title: Suspicious Encoded PowerShell Command
id: encoded-powershell
description: PowerShell launched with an encoded or hidden-window command line.
tags:
  - attack.execution
  - attack.t1059.001
level: high
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -w hidden'
  condition: selection_img and selection_flags
