title: Encoded PowerShell Command
id: sl-0001
description: PowerShell launched with an encoded or hidden command line, common in malware loaders.
level: high
tags: [attack.execution, attack.t1059.001, attack.t1027]
detection:
  img:
    Image|endswith: '\powershell.exe'
  flags:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -w hidden'
  condition: img and flags
tests:
  match:
    - {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', CommandLine: 'powershell -NoP -Enc SQBFAFgA'}
  no_match:
    - {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', CommandLine: 'powershell Get-Date'}
    - {Image: 'C:\Windows\notepad.exe', CommandLine: 'notepad -enc'}
