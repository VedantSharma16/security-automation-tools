title: Scheduled Task Created Running From User-Writable Path
id: 5a1f0c7e-0005-4b2a-9d11-sigmalite005
description: schtasks /create pointing at temp, appdata or public directories.
tags: [attack.persistence, attack.t1053.005]
logsource: {category: process_creation, product: windows}
detection:
  create:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  path:
    CommandLine|contains: ['\AppData\', '\Temp\', '\Users\Public\']
  filter_legit:
    CommandLine|contains: 'GoogleUpdate'
  condition: create and path and not filter_legit
level: medium
