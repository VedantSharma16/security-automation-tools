[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-assistant"
version = "0.1.0"
description = "Authorized-engagement network recon: async port scanning, passive service fingerprinting, HTTP security-header auditing, and an optional LLM-written findings narrative."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
recon-assistant = "recon_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["recon_assistant*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
