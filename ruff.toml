# Lint config for the maintained sub-projects (recon-agent, log-triage-assistant,
# ioc-triage-assistant, process_threat_hunter). The legacy root-level scripts
# (port_scanner.py, system_logger.py) are kept for history and excluded.
line-length = 120
target-version = "py310"
extend-exclude = ["port_scanner.py", "system_logger.py"]

[lint]
# E501 (line length) is a style preference, not correctness; the codebase predates
# this config and isn't uniformly wrapped. F/E/W catch real bugs (unused imports,
# undefined names, bare excepts, etc.) without demanding a repo-wide reformat.
select = ["E", "F", "W"]
ignore = ["E501"]
