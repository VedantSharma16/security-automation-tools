[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "httpsec-auditor"
version = "0.1.0"
description = "Passive HTTP security header, cookie, CORS, and TLS auditor with zero external dependencies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
httpsec-auditor = "httpsec.cli:main"

[tool.setuptools.packages.find]
include = ["httpsec*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
