[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-agent"
version = "0.1.0"
description = "Agentic, read-only attack-surface recon: HTTPS/HTTP/TLS probing and security-header analysis driven by a bounded tool-calling loop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.4"]

[project.scripts]
recon-agent = "recon_agent.cli:main"

[tool.setuptools.packages.find]
include = ["recon_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
