[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-agent"
version = "0.1.0"
description = "An agentic recon tool: an LLM (or deterministic fallback) plans its own sequence of read-only recon tool calls against an authorized target, fingerprints services, and flags known CVEs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
tls = ["cryptography>=42"]
dev = ["pytest>=7.0"]

[project.scripts]
recon-agent = "recon_agent.cli:main"

[tool.setuptools.packages.find]
include = ["recon_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
