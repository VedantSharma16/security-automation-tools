[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-agent"
version = "0.1.0"
description = "Agentic recon pipeline (DNS/subdomain enum, port scan, HTTP/TLS fingerprinting) driven by a Claude tool-use loop, with a deterministic offline fallback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
recon-agent = "recon_agent.cli:main"

[tool.setuptools.packages.find]
include = ["recon_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
