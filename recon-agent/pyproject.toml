[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-agent"
version = "0.1.0"
description = "Agentic passive-recon assistant: an LLM tool-calling loop over from-scratch DNS/HTTP/TLS recon primitives."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
recon-agent = "recon_agent.cli:main"

[tool.setuptools.packages.find]
include = ["recon_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
