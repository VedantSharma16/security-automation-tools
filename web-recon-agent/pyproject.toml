[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-recon-agent"
version = "0.1.0"
description = "A ReAct-style tool-calling agent for authorized web-application reconnaissance, with a deterministic offline planner and an optional Claude-driven dynamic planner."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
recon-agent = "recon_agent.cli:main"

[tool.setuptools.packages.find]
include = ["recon_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
