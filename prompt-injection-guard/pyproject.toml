[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pigard"
version = "0.1.0"
description = "Prompt-injection scanner, canary-token leak detector, and red-team harness for LLM/RAG applications."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pigard = "pigard.cli:main"

[tool.setuptools.packages.find]
include = ["pigard*"]
