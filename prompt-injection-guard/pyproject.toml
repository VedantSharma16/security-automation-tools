[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard"
version = "0.1.0"
description = "Detect prompt injection in untrusted text (RAG chunks, emails, web pages) before it reaches an LLM."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
promptguard = "promptguard.cli:main"

[tool.setuptools.packages.find]
include = ["promptguard*"]
