[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injectionshield"
version = "0.1.0"
description = "Prompt-injection detection for LLM apps plus a red-team harness that measures attack success rate with and without the shield."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
injectionshield = "injectionshield.cli:main"

[tool.setuptools.packages.find]
include = ["injectionshield*"]
