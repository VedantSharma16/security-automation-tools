[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-response-agent"
version = "0.1.0"
description = "A ReAct-style, tool-calling agent that investigates security incidents by orchestrating local threat-intel, CVE, and ATT&CK lookup tools, with a deterministic offline planner and a live Anthropic tool-use planner."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
ir-agent = "ir_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ir_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
