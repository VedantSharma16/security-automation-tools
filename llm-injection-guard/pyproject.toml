[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-injection-guard"
version = "0.1.0"
description = "Prompt-injection and indirect-injection detection, spotlighting, canary leak checks, and an evaluation harness for LLM/RAG applications."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
injection-guard = "injection_guard.cli:main"

[tool.setuptools.packages.find]
include = ["injection_guard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
