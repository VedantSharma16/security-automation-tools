[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secops-agent"
version = "0.1.0"
description = "Sandboxed, tool-using SOC investigation agent with an offline deterministic planner and a live Claude tool-use planner."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
secops-agent = "secops_agent.cli:main"

[tool.setuptools.packages.find]
include = ["secops_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
