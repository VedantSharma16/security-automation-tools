[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webrecon"
version = "0.1.0"
description = "Authorized-use web application reconnaissance: security-header audit, sensitive-file exposure discovery, and tech fingerprinting."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
webrecon = "webrecon.cli:main"

[tool.setuptools.packages.find]
include = ["webrecon*"]
