[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webrecon"
version = "0.1.0"
description = "Passive web recon and security-posture grading (headers, TLS, tech fingerprinting) with an optional LLM-generated analyst narrative."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
llm = ["anthropic>=0.30.0"]
dev = ["pytest>=7.0"]

[project.scripts]
webrecon = "webrecon.cli:main"

[tool.setuptools.packages.find]
include = ["webrecon*"]
