[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-surface-mapper"
version = "0.1.0"
description = "Passive external recon: DNS/email-security posture, CT-log subdomain discovery, HTTP header analysis, and TLS inspection."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
    "dnspython>=2.3.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.30.0"]
dev = ["pytest>=7.0"]

[project.scripts]
asm = "asm.cli:main"

[tool.setuptools.packages.find]
include = ["asm*"]
