[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-surface-mapper"
version = "0.1.0"
description = "Correlate nmap scans against a local CVE/insecure-protocol database and produce a prioritized, LLM-assisted pentest report."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
llm = ["anthropic>=0.30.0"]
dev = ["pytest>=7.0"]

[project.scripts]
asm = "asm.cli:main"

[tool.setuptools.packages.find]
include = ["asm*"]
